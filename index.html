<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Coding Site</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main {
      padding: 40px 48px; border-radius: 16px; text-align: center;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #94a3b8; }
    .dot {
      display: inline-block; width: 8px; height: 8px; margin-right: 6px;
      border-radius: 50%; background: #22c55e; vertical-align: middle;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Coding Site</h1>
    <p><span class="dot"></span>GitHub Pages 环境已就绪，等待作品内容。</p>
  </main>
</body>
</html>
